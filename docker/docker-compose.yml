version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: empire_os_postgres
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: empire_dev_password
      POSTGRES_DB: empire_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: empire_os_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: empire_os_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://empire:empire_dev_password@postgres:5432/empire_os
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app

volumes:
  postgres_data:
  redis_data:
