name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check core
        run: pnpm --filter @empire-os/core type-check

      - name: Test core
        run: pnpm --filter @empire-os/core test

      - name: Build core
        run: pnpm --filter @empire-os/core build

      - name: Build CrossPost Enterprise
        run: pnpm --filter ./apps/crosspost-enterprise build

  api-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Check API imports
        run: python -c "import main; print('API OK')"
        working-directory: apps/api
